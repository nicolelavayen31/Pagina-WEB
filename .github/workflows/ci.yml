name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mantenimiento_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mantenimiento_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database; the name must end in "_test" or the test suites refuse to run.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/mantenimiento_ci_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts and Prisma client
        run: |
          pnpm --filter @repo/contracts build
          pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (PostgreSQL)
        run: pnpm test:int

      - name: Production build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level critical

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
